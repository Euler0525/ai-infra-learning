[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-runtime"
version = "0.1.0"
description = "A minimal Qwen decoder inference runtime for systems learning"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_llm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
